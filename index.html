<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Order premium sushi and Japanese cuisine online from Minza's Sushi House. Fresh ingredients, fast delivery, and special discounts!">

  <title>Minza's Sushi House | Premium Sushi & Japanese Cuisine</title>

  <!-- Preconnect to Google Fonts for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload critical CSS files -->
  <link rel="preload" href="css/main.css" as="style">

  <!-- Load CSS -->
  <link id="main-css" rel="stylesheet" href="css/main.css">
  <link id="checkout-css" rel="stylesheet" href="css/checkout.css">
  <link rel="stylesheet" href="css/a11y-product.css">

  <!-- Favicon (optional but professional) -->
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>

<body>
  <header>
    <nav class="header-container">
      <div class="header-left">
        <button id="theme-toggle" aria-label="Toggle dark/light mode">
          <img id="theme-icon" src="img/light_mode.svg" alt="Theme Icon" width="24" height="24">
        </button>
      </div>

      <h1>Minza's Sushi House</h1>

      <button id="cart-indicator" type="button" aria-label="Open shopping cart">
        <span class="cart-emoji" aria-hidden="true">🛒</span>
        <span id="header-total">0</span> SEK
      </button>
    </nav>
  </header>

  <main>
    <div class="shop-container">
      <aside id="controls">
        <section class="hero">
          <div class="hero-content">
            <h2>Opening Hours</h2>
            <p>Mon - Fri: 11:00 - 20:00</p>
            <p>Sat - Sun: 12:00 - 22:00</p>
          </div>
        </section>
        <div class="control-group">
          <label for="category-filter">Category:</label>
          <select id="category-filter">
            <option value="all">All Items</option>
            <option value="nigiri">Nigiri</option>
            <option value="maki">Maki</option>
            <option value="sashimi">Sashimi</option>
            <option value="ramen">Ramen</option>
            <option value="dumplings">Dumplings</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sort-order">Sort by:</label>
          <select id="sort-order">
            <option value="name">Name (A-Z)</option>
            <option value="price-low">Price (Low-High)</option>
            <option value="price-high">Price (High-Low)</option>
            <option value="rating">Highest Rating</option>
          </select>
        </div>
      </aside>

      <section id="products">
        <h2>Our Menu</h2>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </div>
  </main>

  <!-- Cart Overlay -->
  <div id="cart-overlay" class="cart-overlay" aria-hidden="true"></div>

  <!-- Cart Drawer -->
  <div id="cart-drawer" class="cart-drawer" role="dialog" aria-labelledby="cart-title" aria-modal="true">
    <!-- Cart Header -->
    <header class="cart-header">
      <h2 id="cart-title">Your Cart</h2>
      <button id="close-cart" class="close-cart-btn" aria-label="Close cart" type="button">
        ×
      </button>
    </header>

    <!-- Cart Items -->
    <div id="cart-items-container" class="cart-items" role="list"></div>

    <!-- Cart Footer -->
    <footer class="cart-footer">
      <!-- Discount/Shipping Info -->
      <div id="cart-discount-info" class="cart-discount-info"></div>

      <!-- Total Row -->
      <div class="total-row" aria-live="polite" aria-atomic="true">
        <span class="total-label">Total:</span>
        <span class="total-amount">
          <span id="cart-total-price">0</span> SEK
        </span>
      </div>

      <!-- Action Buttons -->
      <div class="cart-actions">
        <button id="clear-cart-btn" class="order-btn order-btn--secondary" type="button"
          aria-label="Clear all items from cart">
          Clear cart
        </button>
        <button id="checkout-btn" class="order-btn order-btn--primary" type="button">
          Checkout
        </button>
      </div>
    </footer>
  </div>

  <!-- Checkout Overlay (hidden by default) -->
  <div id="checkout-overlay" class="checkout-overlay" style="display:none;">
    <div class="checkout-modal">
      <div style="max-width: 500px; margin: 0 auto;">
        <section id="checkout-cart" style="margin-bottom:2rem;">
          <h2>Your Cart</h2>
          <div id="checkout-cart-items">
            <p>Loading cart...</p>
          </div>
        </section>
        <!-- Personal Information Fields -->
        <form id="checkout-form">
          <!-- First Name -->
          <div class="form-group">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name"
              aria-describedby="error-firstName">
            <span class="error-message" id="error-firstName" aria-live="polite"></span>
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name"
              aria-describedby="error-lastName">
            <span class="error-message" id="error-lastName" aria-live="polite"></span>
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">Address (street)</label>
            <input type="text" id="address" name="address" required autocomplete="address-line1"
              aria-describedby="error-address">
            <span class="error-message" id="error-address" aria-live="polite"></span>
          </div>

          <div class="form-row" style="display:flex; gap:1rem;">
            <!-- Zip Code -->
            <div class="form-group">
              <label for="zip">Zip code</label>
              <input type="text" id="zip" name="zip" required pattern="^[0-9]{5}$"
                title="Please enter a 5-digit zip code (e.g. 12345)" inputmode="numeric" aria-describedby="error-zip">
              <span class="error-message" id="error-zip" aria-live="polite"></span>
            </div>
            <!-- City -->
            <div class="form-group" style="flex:2;">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required aria-describedby="error-city">
              <span class="error-message" id="error-city" aria-live="polite"></span>
            </div>
          </div>

          <!-- Optional Gate Code -->
          <div class="form-group">
            <label for="gateCode">Optional gate code</label>
            <input type="text" id="gateCode" name="gateCode">
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label for="phone">Phone (mobile)</label>
            <input type="tel" id="phone" name="phone" required pattern="^\+?\d{7,15}$"
              title="Please enter a valid phone number (7-15 digits)" autocomplete="tel" aria-describedby="error-phone">
            <span class="error-message" id="error-phone" aria-live="polite"></span>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="error-email">
            <span class="error-message" id="error-email" aria-live="polite"></span>
          </div>

          <!-- Payment Method -->
          <div class="form-group">
            <label>Payment method</label>
            <div style="display:flex; gap:1rem;">
              <label><input type="radio" name="payment" value="card" checked> Card</label>
              <label><input type="radio" name="payment" value="invoice"> Invoice</label>
            </div>
          </div>

          <!-- Card Fields -->
          <div id="card-fields" class="form-group">
            <label for="cardNumber">Card number</label>
            <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" maxlength="19"
              placeholder="1234 5678 9012 3456" pattern="^\d{13,19}$"
              title="Please enter a valid card number (13-19 digits)" aria-describedby="error-cardNumber">
            <span class="error-message" id="error-cardNumber" aria-live="polite"></span>

            <div style="display:flex; gap:1rem;">
              <!-- Expiry Date -->
              <div style="flex:1;">
                <label for="cardExpiry">Date/Year</label>
                <input type="text" id="cardExpiry" name="cardExpiry" maxlength="5" placeholder="MM/YY"
                  pattern="^(0[1-9]|1[0-2])\/\d{2}$" title="Please enter expiry date in MM/YY format"
                  aria-describedby="error-cardExpiry">
                <span class="error-message" id="error-cardExpiry" aria-live="polite"></span>
              </div>
              <!-- CVC -->
              <div style="flex:1;">
                <label for="cardCVC">Security code</label>
                <input type="text" id="cardCVC" name="cardCVC" maxlength="4" placeholder="123" pattern="^\d{3,4}$"
                  title="Please enter a valid CVC (3-4 digits)" aria-describedby="error-cardCVC">
                <span class="error-message" id="error-cardCVC" aria-live="polite"></span>
              </div>
            </div>
          </div>

          <!-- Invoice Fields -->
          <div id="invoice-fields" class="form-group" style="display:none;">
            <label for="ssn">Personal identity number (YYYYMMDD-XXXX)</label>
            <input type="text" id="ssn" name="ssn" pattern="^(19|20)?[0-9]{6}[- ]?[0-9]{4}$"
              aria-describedby="error-ssn">
            <span class="error-message" id="error-ssn" aria-live="polite"></span>
          </div>
          <!-- Discount Code -->
          <div class="form-group">
            <label for="discount">Discount code</label>
            <input type="text" id="discount" name="discount">
          </div>
          <!-- GDPR Consent -->
          <div class="form-group">
            <label>
              <input type="checkbox" id="gdpr" name="gdpr" required aria-describedby="error-gdpr">
              I agree to the processing of personal data
            </label>
            <span class="error-message" id="error-gdpr" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="newsletter" name="newsletter" checked>
              Subscribe to newsletter
            </label>
          </div>
          <!-- Form Buttons -->
          <div style="display:flex; gap:1rem; margin-top:2rem;">
            <button type="submit" id="submit-btn" class="order-btn" disabled>Submit order</button>
            <button type="reset" id="reset-btn" class="order-btn">Clear order</button>
          </div>
        </form>
        <!-- Back to Store Button -->
        <button id="close-checkout" aria-label="Back to store" class="order-btn back-to-store"
          style="margin-top:2.5rem; width:100%;">Back to store</button>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="footer-left">
        <h2>Follow Us</h2>
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer"
          aria-label="Visit our Facebook page">
          <img src="img/facebook.svg" alt="Facebook">
        </a>

        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer"
          aria-label="Follow us on Instagram">
          <img src="img/instagram.svg" alt="Instagram">
        </a>
      </div>

      <div class="footer-center">
        <h2>Minza's Sushi House</h2>
        <p>Premium Sushi & Ramen</p>
        <p>© 2024 Minza's Sushi</p>
      </div>

      <div class="footer-right">
        <h2>Contact</h2>
        <p><a href="mailto:info@minzasushi.se" class="footer-mail-link">info@minzasushi.se</a></p>
        <p> 08-123 456 78</p>
      </div>
    </div>
  </footer>
  <!-- JavaScript Files -->
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/theme.js"></script>
</body>

</html>
