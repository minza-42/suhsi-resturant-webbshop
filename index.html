<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minza's Sushi House | Premium Sushi</title>
  <link id="main-css" rel="stylesheet" href="css/main.css">
</head>

<body>
  <header>
    <nav class="header-container">
      <div class="header-left">
        <button id="theme-toggle" aria-label="Toggle dark/light mode">
          <img id="theme-icon" src="img/light_mode.svg" alt="Theme Icon" width="24" height="24">
        </button>
      </div>

      <h1>Minza's Sushi House</h1>

      <div id="cart-indicator" class="header-cart">
        🛒 <span id="header-total">0</span> kr
      </div>
    </nav>
  </header>

  <main>
    <div class="shop-container">
      <aside id="controls">
        <section class="hero">
          <div class="hero-content">
            <h2>Opening Hours</h2>
            <p>Mon - Fri: 11:00 - 20:00</p>
            <p>Sat - Sun: 12:00 - 22:00</p>
          </div>
        </section>
        <div class="control-group">
          <label for="category-filter">Category:</label>
          <select id="category-filter">
            <option value="all">All Items</option>
            <option value="nigiri">Nigiri</option>
            <option value="maki">Maki</option>
            <option value="sashimi">Sashimi</option>
            <option value="ramen">Ramen</option>
            <option value="dumplings">Dumplings</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sort-order">Sort by:</label>
          <select id="sort-order">
            <option value="name">Name (A-Z)</option>
            <option value="price-low">Price (Low-High)</option>
            <option value="price-high">Price (High-Low)</option>
            <option value="rating">Highest Rating</option>
          </select>
        </div>
      </aside>

      <section id="products">
        <h2>Our Menu</h2>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </div>
  </main>

  <div id="cart-overlay" class="cart-overlay"></div>
  <section id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart">×</button>
    </div>
    <div id="cart-items-container"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total:</span>
        <span><span id="cart-total-price">0</span> kr</span>
      </div>
      <button id="clear-cart-btn" class="order-btn" style="background:#ccc;color:#222;margin-bottom:0.5rem;">Clear
        cart</button>
      <button id="checkout-btn" class="order-btn">Checkout</button>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        <h3>Follow Us</h3>
        <img src="img/facebook.svg" alt="Facebook">
        <img src="img/instagram.svg" alt="Instagram">
      </div>

      <div class="footer-center">
        <h3>Minza's Sushi House</h3>
        <p>Premium Sushi & Ramen</p>
        <p>© 2024 Minza's Sushi</p>
      </div>

      <div class="footer-right">
        <h3>Contact</h3>
        <p><a href="mailto:info@minzasushi.se" class="footer-mail-link">info@minzasushi.se</a></p>
        <p> 08-123 456 78</p>
      </div>
    </div>
  </footer>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/theme.js"></script>
</body>

</html>
