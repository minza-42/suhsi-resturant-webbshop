<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <title>Minza's Sushi House | Premium Sushi</title>
</head>

<body>
  <button id="backToTop" title="Go to top">↑</button>

  <header>
    <nav>
      <button id="theme-toggle" aria-label="Toggle dark/light mode"
        style="margin-right:1rem;background:none;border:none;padding:0;cursor:pointer;">
        <img src="img/dark_mode.svg" alt="Dark mode" width="24" height="24" style="vertical-align:middle;">
      </button>
      <h1>Minza's Sushi House</h1>
      <div id="cart-indicator" style="cursor: pointer;">
        🛒 <span id="header-total">0</span> kr
      </div>
    </nav>
  </header>

  <main>
    <div class="shop-container">
      <section id="controls">
        <div class="control-group">
          <label for="category-filter">Category:</label>
          <select id="category-filter">
            <option value="all">All Items</option>
            <option value="Nigiri">Nigiri</option>
            <option value="Maki">Maki</option>
            <option value="Sashimi">Sashimi</option>
            <option value="Ramen">Ramen</option>
            <option value="Dumplings">Dumplings</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sort-order">Sort by:</label>
          <select id="sort-order">
            <option value="name">Name (A-Z)</option>
            <option value="price-low">Price (Low-High)</option>
            <option value="price-high">Price (High-Low)</option>
            <option value="rating">Highest Rating</option>
          </select>
        </div>
      </section>

      <section id="products">
        <h2>Our Menu</h2>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </div>
  </main>

  <div id="cart-overlay" class="cart-overlay"></div>
  <section id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart">×</button>
    </div>
    <div id="cart-items-container">
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total:</span>
        <span><span id="cart-total-price">0</span> kr</span>
      </div>
      <button id="clear-cart-btn" class="order-btn" style="background:#ccc;color:#222;margin-bottom:0.5rem;">Clear
        cart</button>
      <button id="checkout-btn" class="order-btn">Checkout</button>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>

</html>
