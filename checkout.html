<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Sushi Shop</title>
</head>

<body>
    <header>
        <nav style="display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:2rem;">
            <button id="theme-toggle" aria-label="Toggle dark/light mode"
                style="background:none;border:none;padding:0;cursor:pointer;">
                <img src="img/dark_mode.svg" alt="Dark mode" width="24" height="24" style="vertical-align:middle;">
            </button>
            <h1 style="margin:0;">Checkout</h1>
        </nav>
    </header>
    <main style="max-width: 500px; margin: 0 auto;">
        <section id="checkout-cart" style="margin-bottom:2rem;">
            <h2>Your Cart</h2>
            <div id="checkout-cart-items">
                <p>Loading cart...</p>
            </div>
        </section>
        <form id="checkout-form" novalidate>
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" required autocomplete="given-name" />
                <span class="error-message" id="error-firstName" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" required autocomplete="family-name" />
                <span class="error-message" id="error-lastName" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="address">Address (street)</label>
                <input type="text" id="address" name="address" required autocomplete="street-address" />
                <span class="error-message" id="error-address" aria-live="polite"></span>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label for="zip">Zip code</label>
                    <input type="text" id="zip" name="zip" required pattern="^[0-9]{5}$" inputmode="numeric" />
                    <span class="error-message" id="error-zip" aria-live="polite"></span>
                </div>
                <div class="form-group" style="flex:2;">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required />
                    <span class="error-message" id="error-city" aria-live="polite"></span>
                </div>
            </div>
            <div class="form-group">
                <label for="gateCode">Optional gate code</label>
                <input type="text" id="gateCode" name="gateCode" />
            </div>
            <div class="form-group">
                <label for="phone">Phone (mobile)</label>
                <input type="tel" id="phone" name="phone" required pattern="^\+?\d{7,15}$" autocomplete="tel" />
                <span class="error-message" id="error-phone" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email" />
                <span class="error-message" id="error-email" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label>Payment method</label>
                <div style="display:flex; gap:1rem;">
                    <label><input type="radio" name="payment" value="card" checked /> Card</label>
                    <label><input type="radio" name="payment" value="invoice" /> Invoice</label>
                </div>
            </div>
            <div id="card-fields" class="form-group">
                <label for="cardNumber">Card number</label>
                <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" maxlength="19"
                    placeholder="1234 5678 9012 3456" />
                <div style="display:flex; gap:1rem;">
                    <div style="flex:1;">
                        <label for="cardExpiry">Date/Year</label>
                        <input type="text" id="cardExpiry" name="cardExpiry" maxlength="5" placeholder="MM/YY" />
                    </div>
                    <div style="flex:1;">
                        <label for="cardCVC">Security code</label>
                        <input type="text" id="cardCVC" name="cardCVC" maxlength="4" placeholder="123" />
                    </div>
                </div>
            </div>
            <div id="invoice-fields" class="form-group" style="display:none;">
                <label for="ssn">Swedish personal identity number (ÅÅÅÅMMDD-XXXX)</label>
                <input type="text" id="ssn" name="ssn" pattern="^(19|20)?[0-9]{6}[- ]?[0-9]{4}$" />
                <span class="error-message" id="error-ssn" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="discount">Discount code</label>
                <input type="text" id="discount" name="discount" />
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="gdpr" name="gdpr" required /> I agree to the processing of personal
                    data</label>
                <span class="error-message" id="error-gdpr" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="newsletter" name="newsletter" checked /> Subscribe to
                    newsletter</label>
            </div>
            <div style="display:flex; gap:1rem; margin-top:2rem;">
                <button type="submit" id="submit-btn" class="order-btn" disabled>Submit order</button>
                <button type="reset" id="reset-btn" class="order-btn" style="background:#ccc;color:#222;">Clear
                    order</button>
            </div>
        </form>
        <a href="index.html" class="order-btn back-to-store">Back to store</a>
    </main>
    <script src="src/checkout.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
